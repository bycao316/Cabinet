      function normalizeTournament(value, limit) {
        if (!value || !Array.isArray(value.seeds)) return null;
        const seeds = [...new Set(value.seeds.filter(id => typeof id === "string"))].slice(0,limit);
        if (seeds.length < 2) return null;
        return {seeds, history:(Array.isArray(value.history) ? value.history : [])
          .filter(entry => entry && typeof entry.key === "string" && seeds.includes(entry.winner))
          .slice(0,2000).map(entry => ({key:entry.key,winner:entry.winner}))};
      }

      // Every round's eliminated entrants play their own placement bracket.
      // This gives every entrant a unique position instead of guessing tied ranks.
      function evaluateTournament(tournament) {
        const decisions = new Map(tournament.history.map(entry => [entry.key,entry.winner]));
        const stages = [];
        function placement(ids, path, startRank) {
          if (ids.length <= 1) return {order:ids.slice(),next:null};
          let size = 2; while (size < ids.length) size *= 2;
          const pairs = [], doubleMatches = ids.length - size / 2;
          let cursor = 0;
          for (let i=0;i<size/2;i++) pairs.push([ids[cursor++],i<doubleMatches ? ids[cursor++] : null]);
          const rounds = []; let prior = null, pending = null;
          for (let round=0; round<Math.log2(size); round++) {
            const matches=[];
            for(let i=0;i<size/2**(round+1);i++) {
              const parents = round ? [prior[i*2],prior[i*2+1]] : null;
              const ready = !parents || parents.every(match => match.resolved);
              const entrants = parents ? parents.map(match => match.winner || null) : pairs[i];
              const key = `${path}:${round}:${i}`;
              const [a,b] = entrants;
              let winner=null, loser=null, resolved=false, bye=false;
              if (ready) {
                if (!a || !b) { winner=a||b; resolved=true; bye=true; }
                else if (decisions.get(key) === a || decisions.get(key) === b) {
                  winner=decisions.get(key); loser=winner===a ? b : a; resolved=true;
                }
              }
              const match={key,entrants,ready,winner,loser,resolved,bye};
              if (ready && !resolved && !pending) pending=match;
              matches.push(match);
            }
            rounds.push(matches); prior=matches;
          }
          stages.push({path,startRank,endRank:startRank+ids.length-1,rounds});
          if (!prior[0].resolved) return {order:[],next:pending};
          const order=[prior[0].winner];
          for(let r=rounds.length-1;r>=0;r--) {
            const losers=rounds[r].map(match=>match.loser).filter(Boolean);
            if (!losers.length) continue;
            const result=placement(losers,`${path}.${r}`,startRank+order.length);
            order.push(...result.order);
            if (result.next) return {order,next:result.next};
          }
          return {order,next:null};
        }
        const result=placement(tournament.seeds,"main",1);
        return {...result,stages,complete:!result.next && result.order.length===tournament.seeds.length};
      }

      function renderTournament() {
        const host=document.querySelector("#tournamentContent"); if (!host) return;
        host.replaceChildren();
        const list=rankings.find(list=>list.id===activeRanking); if(!list)return;
        const makeText=(tag,text)=>{const element=document.createElement(tag);element.textContent=text;return element;};
        host.append(makeText("p",`从已有作品里选 2–${list.limit} 张专辑，不必先排顺序。随机分组，遇到人数不足会自动轮空；同轮淘汰者再加赛分出名次。`));
        if (!list.tournament) {
          const selected=new Set(list.itemIds.filter(id=>state.items.some(item=>item.id===id && item.category==="专辑")));
          const count=makeText("p",""); const options=document.createElement("div"); options.className="tournament-pick-list";
          const albums=state.items.filter(item=>item.category==="专辑");

      async function exportRankingImage() {
        const list = rankings.find(list => list.id === activeRanking);
        if (!list?.itemIds.length) return;
        const entries = list.itemIds.map(id => state.items.find(item => item.id === id)).filter(Boolean);
        const name = list.name, description = list.description || "";
        const button = document.querySelector("#shareRanking"); button.disabled = true;
        showToast("正在生成分享图，无法读取的封面会使用文字卡片");
        try {
          const images = new Map(); let cursor = 0;
          // Bound concurrency and wait time; unavailable/cross-origin covers never block export.
          await Promise.all(Array.from({length: Math.min(6, entries.length)}, async () => {
            while (cursor < entries.length) {
              const item = entries[cursor++]; if (!item.poster) continue;
              const image = await new Promise(resolve => {
                const img = new Image(); img.crossOrigin = "anonymous"; img.referrerPolicy = "no-referrer";
                const timer = setTimeout(() => { img.onload = img.onerror = null; img.src = ""; resolve(null); }, 1500);
                img.onload = () => { clearTimeout(timer); resolve(img); };
                img.onerror = () => { clearTimeout(timer); resolve(null); };
                img.src = item.poster;
              });
              if (image) images.set(item.id, image);
            }
          }));
          const canvas = document.createElement("canvas"); canvas.width = 900; canvas.height = 190 + Math.ceil(entries.length / 3) * 310;
          const ctx = canvas.getContext("2d"); if (!ctx) throw Error("Canvas unavailable");
          ctx.fillStyle = "#10100e"; ctx.fillRect(0, 0, canvas.width, canvas.height);
          const text = (value, x, y, width, size, color) => {
            ctx.font = `${size}px sans-serif`; ctx.fillStyle = color;
            let line = String(value || ""); while (line.length && ctx.measureText(line).width > width) line = line.slice(0,-1);
            ctx.fillText(line, x, y);
          };
          text(name, 30, 55, 840, 32, "#f0a23a"); text(description, 30, 94, 840, 18, "#d5c8b2");
          text(`我的 Top ${list.limit} · 已选 ${entries.length} 部`, 30, 130, 840, 18, "#d5c8b2");
          entries.forEach((item, index) => {
            const x = 30 + index % 3 * 290, y = 165 + Math.floor(index / 3) * 310;
            ctx.fillStyle = "#292720"; ctx.fillRect(x, y, 260, 195);
            const image = images.get(item.id);
            if (image) { const scale = Math.min(260 / image.naturalWidth,195 / image.naturalHeight); const w=image.naturalWidth*scale,h=image.naturalHeight*scale;ctx.drawImage(image,x+(260-w)/2,y+(195-h)/2,w,h); }
            else text(item.title,x+12,y+100,236,20,"#f6ead5");
            text(`#${index+1}  ${item.title}`,x,y+224,260,20,"#f0a23a");
            text(`${item.creator || item.category} · ${formatRating(item.rating)}`,x,y+250,260,16,"#f6ead5");
            text(item.comment,x,y+276,260,14,"#b6ad9f");
          });
          const blob = await new Promise(resolve => canvas.toBlob(resolve,"image/png"));
          if (!blob) throw Error("Image export failed");
          const url = URL.createObjectURL(blob); const link = document.createElement("a");
          link.href = url; link.download = `${name.replace(/[\\/:*?"<>|]/g,"-")}.png`; link.click();
          setTimeout(() => URL.revokeObjectURL(url),60000); showToast("分享长图已生成");
        } catch { showToast("这台设备暂时无法生成长图，可以先截图保存榜单"); }
        finally { button.disabled = false; }
      }

      function renderBulkTools() {

          checkbox.onchange = () => {

            document.querySelector("#applyBulk").disabled = !bulkSelection.size;

      function applyBulkMetadata() {
        const languages = splitLabels(document.querySelector("#bulkLanguages").value);
        const genres = splitLabels(document.querySelector("#bulkGenres").value);
        const year = document.querySelector("#bulkYear").value.trim();
        const status = document.querySelector("#bulkStatus").value;
        if (year && !/^\d{4}$/.test(year)) return showToast("年份请填写四位数字");
        if (!languages.length && !genres.length && !year && !status) return showToast("请先填写要修改的内容");
        if (!bulkSelection.size || !confirm(`修改所选 ${bulkSelection.size} 部作品的分类资料？评分和短评保持不变。`)) return;
        state.items = state.items.map(item => {
          if (!bulkSelection.has(item.id)) return item;
          const next = { ...item, updatedAt: new Date().toISOString() };
          if (languages.length) next.languages = splitLabels([...splitLabels(item.languages), ...languages]);
          if (year) next.year = year;
          if (item.category === "专辑") {
            if (genres.length) next.genres = splitLabels([...splitLabels(item.genres), ...genres]);
            if (status) next.status = status;
          }
          return next;
        });
        saveItems(); bulkSelection.clear(); render(); showToast("批量修改已保存");
      }

      function registerWebMcpTools() {
        const context = document.modelContext;
        if (!context?.registerTool) return;
        const lifecycle = new AbortController();
        const register = tool =>
          Promise.resolve(context.registerTool(tool, { signal: lifecycle.signal })).catch(console.error);

        register({
          name: "list_media_items",
          title: "List media items",
          description: "Read the current visible personal media cabinet records.",
          inputSchema: {
            type: "object",
            properties: {
              category: { type: "string" },
              search: { type: "string" }
            },
            additionalProperties: false
          },
          annotations: { readOnlyHint: true, untrustedContentHint: true },
          execute(input = {}) {
            const previous = { category: state.selectedCategory, search: state.search };
            if (input.category) state.selectedCategory = input.category;
            if (typeof input.search === "string") state.search = input.search;
            const items = getFilteredItems().map(item => ({ ...item }));
            state.selectedCategory = previous.category;
            state.search = previous.search;
            return { count: items.length, items };
          }
        });

        register({
          name: "create_media_item",
          title: "Create media item",
          description: "Create a new record in the personal media cabinet and update the visible page.",
          inputSchema: {
            type: "object",
            properties: {
              title: { type: "string" },
              category: { type: "string" },
              status: { type: "string" },
              creator: { type: "string" },
              year: { type: ["string", "number"] },
              rating: { type: "number" },
              aspectScores: {
                type: "object",
                additionalProperties: { type: "number" }
              },
              poster: { type: "string" },
              tags: { type: "array", items: { type: "string" } },
              comment: { type: "string" }
            },
            required: ["title", "category"],
            additionalProperties: false
          },
          annotations: { readOnlyHint: false, untrustedContentHint: true },
          execute(input) {
            if (!input || typeof input.title !== "string") throw new Error("title is required");
            const item = {
              id: crypto.randomUUID(),
              title: input.title,
              originalTitle: "",
              category: input.category,
              status: input.status || "想看",
              creator: input.creator || "",
              year: input.year || "",
              rating: Number(input.rating || 0),
              aspectScores: getAspectScores(input),
              poster: input.poster || "",
              tags: Array.isArray(input.tags) ? input.tags : [],
              comment: input.comment || "",
              updatedAt: new Date().toISOString()
            };
            upsertItem(item);
            return { id: item.id, title: item.title, count: state.items.length };
          }
        });

        register({
          name: "update_media_item",
          title: "Update media item",
          description: "Update an existing media cabinet record and refresh the visible page.",
          inputSchema: {
            type: "object",
            properties: {
              id: { type: "string" },
              title: { type: "string" },
              category: { type: "string" },
              status: { type: "string" },
              creator: { type: "string" },
              year: { type: ["string", "number"] },
              rating: { type: "number" },
              aspectScores: {
                type: "object",
                additionalProperties: { type: "number" }
              },
              poster: { type: "string" },
              tags: { type: "array", items: { type: "string" } },
              comment: { type: "string" }
            },
            required: ["id"],
            additionalProperties: false
          },
          annotations: { readOnlyHint: false, untrustedContentHint: true },
          execute(input) {
            if (!input || typeof input.id !== "string") throw new Error("id is required");
            const item = state.items.find(entry => entry.id === input.id);
            if (!item) throw new Error("item not found");
            const next = {
              ...item,
              ...Object.fromEntries(
                Object.entries(input).filter(([key, value]) => key !== "id" && value !== undefined)
              ),
              updatedAt: new Date().toISOString()
            };
            next.aspectScores = getAspectScores(next);
            upsertItem(next);
            return { id: next.id, title: next.title, count: state.items.length };
          }
        });

        register({
          name: "delete_media_item",
          title: "Delete media item",
          description: "Delete one media cabinet record by ID and refresh the visible page.",
          inputSchema: {
            type: "object",
            properties: {
              id: { type: "string" }
            },
            required: ["id"],
            additionalProperties: false
          },
          annotations: { readOnlyHint: false, untrustedContentHint: true },
          execute(input) {
            if (!input || typeof input.id !== "string") throw new Error("id is required");
            const before = state.items.length;
            state.items = state.items.filter(item => item.id !== input.id);
            if (state.items.length === before) throw new Error("item not found");
            saveItems();
            render();
            return { deletedId: input.id, count: state.items.length };
          }
        });
      }

      document.querySelector("#expandRadar").onclick = () => {
        const expanded=document.querySelector(".radar-card").classList.toggle("radar-expanded");
        document.querySelector("#expandRadar").textContent=expanded?"收起，返回作品详情":"放大拖动八维图";
      };
      el.searchInput.addEventListener("input", event => {
        state.search = event.target.value;
        renderGallery();
      });
      el.statusFilter.addEventListener("change", event => {
        state.status = event.target.value;
        renderGallery();
      });
      el.sortSelect.addEventListener("change", event => {
        state.sort = event.target.value;
        renderGallery();
      });
      el.gridView.addEventListener("click", () => {
        state.view = "grid";
        el.gridView.classList.add("active");
        el.listView.classList.remove("active");
        renderGallery();
      });
      el.listView.addEventListener("click", () => {
        state.view = "list";
        el.listView.classList.add("active");
        el.gridView.classList.remove("active");
        renderGallery();
      });
      el.addButton.addEventListener("click", openLibrarySearch);
      el.libraryCloseButton.addEventListener("click", closeLibrarySearch);
      el.librarySearch.addEventListener("click", event => {
        if (event.target === el.librarySearch) closeLibrarySearch();
      });
      el.librarySearchForm.addEventListener("submit", event => {
        event.preventDefault();
        runLibrarySearch();
      });
      el.libraryCategory.addEventListener("change", () => {
        albumSearchVersion++;
        el.libraryQuery.placeholder = el.libraryCategory.value === "专辑" ? "输入专辑名或艺人名，例如 崔健 宽容" : "输入作品名";
        el.libraryResults.replaceChildren();
        el.libraryMessage.textContent = "输入名字开始搜索。";
      });
      el.tmdbKey.addEventListener("change", saveApiSettings);
      el.rawgKey.addEventListener("change", saveApiSettings);
      el.manualAddButton.addEventListener("click", () => {
        closeLibrarySearch();
        openDetail();
      });
      el.closeButton.addEventListener("click", closeDetail);
      el.cancelButton.addEventListener("click", closeDetail);
      el.detail.addEventListener("click", event => {
        if (event.target === el.detail) closeDetail();
      });
      el.ratingField.addEventListener("input", event => {
        el.ratingValue.textContent = Number(event.target.value).toFixed(1);
        renderRadar({
          category: el.categoryField.value,
          rating: Number(event.target.value || 0),
          aspectScores: getCurrentAspectScores()
        });
      });
      el.categoryField.addEventListener("change", event => {
        const nextCategory = event.target.value;
        const scores = getAspectScores({
          category: nextCategory,
          rating: Number(el.ratingField.value || 0)
        });
        renderAspectControls(nextCategory, scores);
        renderRadar({
          category: nextCategory,
          rating: Number(el.ratingField.value || 0),
          aspectScores: getCurrentAspectScores()
        });
      });
      el.aspectFields.addEventListener("input", event => {
        const key = event.target?.dataset?.aspectKey;
        if (!key) return;
        syncBreakSlider(event.target,Number(event.target.value));
        updateAspectOutput(key, event.target.value);
        renderRadar({
          category: el.categoryField.value,
          rating: Number(el.ratingField.value || 0),
          aspectScores: getCurrentAspectScores()
        });
      });
      el.posterField.addEventListener("change", () => {
        el.detailPoster.replaceChildren(createPoster(readFormItem()));
      });
      el.detailForm.addEventListener("submit", event => {
        event.preventDefault();
        upsertItem(readFormItem());
        closeDetail();
        showToast("已保存");
      });
      el.deleteButton.addEventListener("click", deleteCurrentItem);
      el.exportButton.addEventListener("click", exportData);
      el.importButton.addEventListener("click", () => el.fileInput.click());
      el.fileInput.addEventListener("change", event => {
        const file = event.target.files?.[0];
        if (!file) return;
        importData(file).catch(error => showToast(error.message || "导入失败"));
        event.target.value = "";
      });
      el.resetButton.addEventListener("click", resetData);
      window.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          closeLibrarySearch();
          closeDetail();
        }
      });

      initializeCollectionTools();
      initializeRankingPage();
      render();
      registerWebMcpTools();
    </script>
  </body>
</html>
