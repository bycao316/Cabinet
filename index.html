<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yao Media Cabinet</title>
    <meta
      name="description"
      content="私人作品评分柜：收藏电影、书籍、游戏、漫画、动漫和专辑，记录评分与短评。"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23080706'/%3E%3Cpath d='M16 14h32v36H16z' fill='%23181713' stroke='%23f0a23a' stroke-width='3'/%3E%3Cpath d='M23 22h18M23 32h18M23 42h10' stroke='%2376d7d0' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='46' cy='18' r='5' fill='%23e84b6a'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #070706;
        --panel: rgba(18, 18, 17, 0.84);
        --panel-strong: rgba(26, 24, 22, 0.94);
        --line: rgba(255, 236, 205, 0.13);
        --line-bright: rgba(255, 170, 70, 0.42);
        --text: #f6ead5;
        --muted: rgba(246, 234, 213, 0.66);
        --soft: rgba(246, 234, 213, 0.42);
        --orange: #f0a23a;
        --blue: #76d7d0;
        --red: #e84b6a;
        --green: #61d394;
        --shadow: 0 24px 90px rgba(0, 0, 0, 0.48);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        background:
          radial-gradient(circle at 15% 0%, rgba(240, 162, 58, 0.16), transparent 28rem),
          radial-gradient(circle at 82% 8%, rgba(118, 215, 208, 0.11), transparent 24rem),
          linear-gradient(180deg, #0b0a08 0%, #070706 46%, #030303 100%);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Noto Sans SC", sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        color: inherit;
      }

      .app {
        min-height: 100vh;
        padding: 24px;
      }

      .shell {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        gap: 18px;
        max-width: 1680px;
        min-height: calc(100vh - 48px);
        margin: 0 auto;
      }

      .sidebar,
      .workspace {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 18px;
        position: sticky;
        top: 24px;
        height: calc(100vh - 48px);
        overflow: auto;
      }

      .brand {
        display: grid;
        gap: 10px;
      }

      .brand small {
        color: var(--orange);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(34px, 4.2vw, 68px);
        line-height: 0.95;
        letter-spacing: 0;
      }

      .brand p {
        color: var(--muted);
        font-size: 15px;
        line-height: 1.7;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .stat {
        min-height: 84px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.035);
      }

      .stat strong {
        display: block;
        font-size: 28px;
        line-height: 1;
      }

      .stat span {
        display: block;
        margin-top: 8px;
        color: var(--muted);
        font-size: 13px;
      }

      .section-title {
        margin-bottom: 10px;
        color: var(--soft);
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .category-list,
      .tool-list {
        display: grid;
        gap: 8px;
      }

      .category-button,
      .tool-button,
      .ghost-button,
      .primary-button,
      .icon-button {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.035);
        cursor: pointer;
        transition:
          transform 130ms ease,
          border-color 130ms ease,
          background 130ms ease,
          box-shadow 130ms ease;
      }

      .category-button,
      .tool-button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 44px;
        padding: 10px 12px;
        text-align: left;
      }

      .category-button:hover,
      .tool-button:hover,
      .ghost-button:hover,
      .primary-button:hover,
      .icon-button:hover {
        transform: translateY(-1px);
        border-color: var(--line-bright);
        background: rgba(240, 162, 58, 0.10);
      }

      .category-button.active {
        border-color: rgba(118, 215, 208, 0.50);
        background: rgba(118, 215, 208, 0.12);
        box-shadow: 0 0 0 1px rgba(118, 215, 208, 0.14) inset;
      }

      .count-pill,
      .type-pill,
      .status-pill {
        border-radius: 999px;
        padding: 4px 8px;
        color: var(--text);
        font-size: 12px;
        font-weight: 800;
        background: rgba(255, 255, 255, 0.08);
      }

      .workspace {
        display: grid;
        grid-template-rows: auto auto 1fr;
        min-width: 0;
        overflow: hidden;
      }

      .topbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 12px;
        align-items: center;
        padding: 16px;
        border-bottom: 1px solid var(--line);
      }

      .search {
        position: relative;
      }

      .search input,
      .control select,
      .field input,
      .field select,
      .field textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.24);
        color: var(--text);
        outline: none;
      }

      .search input {
        height: 46px;
        padding: 0 15px;
        font-size: 16px;
      }

      .search input:focus,
      .control select:focus,
      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        border-color: rgba(118, 215, 208, 0.68);
        box-shadow: 0 0 0 3px rgba(118, 215, 208, 0.13);
      }

      .control {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .control select {
        height: 46px;
        min-width: 132px;
        padding: 0 12px;
      }

      .primary-button,
      .ghost-button {
        min-height: 46px;
        padding: 0 16px;
        font-weight: 900;
      }

      .primary-button {
        border-color: rgba(240, 162, 58, 0.54);
        background: linear-gradient(135deg, rgba(240, 162, 58, 0.32), rgba(232, 75, 106, 0.20));
      }

      .subbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }

      .subbar h2 {
        font-size: 18px;
      }

      .subbar p {
        color: var(--muted);
        font-size: 14px;
      }

      .view-toggle {
        display: inline-flex;
        gap: 6px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.035);
      }

      .icon-button {
        width: 38px;
        height: 34px;
        border-color: transparent;
        font-size: 16px;
      }

      .icon-button.active {
        background: rgba(118, 215, 208, 0.16);
        color: var(--blue);
      }

      .gallery-wrap {
        overflow: auto;
        padding: 16px;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 16px;
        align-items: start;
      }

      .gallery.list {
        grid-template-columns: 1fr;
      }

      .card {
        display: grid;
        gap: 10px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.036);
        text-align: left;
        cursor: pointer;
        overflow: hidden;
        min-width: 0;
      }

      .card:hover {
        border-color: var(--line-bright);
        background: rgba(255, 255, 255, 0.060);
        transform: translateY(-2px);
      }

      .poster {
        position: relative;
        width: 100%;
        aspect-ratio: 2 / 3;
        overflow: hidden;
        border-radius: 6px;
        background:
          linear-gradient(145deg, rgba(240, 162, 58, 0.28), transparent),
          radial-gradient(circle at 70% 25%, rgba(118, 215, 208, 0.25), transparent 38%),
          #171411;
      }

      .poster img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .poster-fallback {
        display: grid;
        place-items: end start;
        height: 100%;
        padding: 14px;
        color: rgba(255, 238, 210, 0.92);
        font-size: 22px;
        font-weight: 900;
        line-height: 1.1;
      }

      .poster::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, transparent 50%, rgba(0, 0, 0, 0.70));
        pointer-events: none;
      }

      .rating-badge {
        position: absolute;
        right: 8px;
        top: 8px;
        z-index: 2;
        border-radius: 999px;
        padding: 5px 8px;
        background: rgba(0, 0, 0, 0.68);
        color: var(--orange);
        font-size: 13px;
        font-weight: 950;
      }

      .card-body {
        display: grid;
        gap: 7px;
      }

      .card h3 {
        overflow-wrap: anywhere;
        font-size: 16px;
        line-height: 1.35;
      }

      .meta,
      .card-comment {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .card-comment {
        display: -webkit-box;
        overflow: hidden;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .card-foot {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .gallery.list .card {
        grid-template-columns: 92px minmax(0, 1fr);
        align-items: center;
      }

      .gallery.list .poster {
        aspect-ratio: 2 / 3;
      }

      .empty-state {
        display: grid;
        place-items: center;
        min-height: 420px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        color: var(--muted);
        text-align: center;
      }

      .detail {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        background: rgba(0, 0, 0, 0.58);
        padding: 24px;
      }

      .detail.open {
        display: grid;
        place-items: center;
      }

      .detail-panel {
        display: grid;
        grid-template-columns: minmax(220px, 330px) minmax(0, 1fr);
        width: min(1060px, 100%);
        max-height: min(880px, calc(100vh - 48px));
        overflow: hidden;
        border: 1px solid rgba(255, 236, 205, 0.18);
        border-radius: 8px;
        background:
          radial-gradient(circle at 10% 0%, rgba(240, 162, 58, 0.12), transparent 22rem),
          var(--panel-strong);
        box-shadow: 0 30px 120px rgba(0, 0, 0, 0.72);
      }

      .detail-art {
        padding: 18px;
        border-right: 1px solid var(--line);
        overflow: auto;
      }

      .detail-art .poster {
        box-shadow: 0 18px 54px rgba(0, 0, 0, 0.46);
      }

      .radar-card {
        display: grid;
        gap: 12px;
        margin-top: 14px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background:
          radial-gradient(circle at 50% 32%, rgba(118, 215, 208, 0.10), transparent 62%),
          rgba(255, 255, 255, 0.035);
      }

      .radar-card.radar-expanded {
        position: fixed; inset: 16px; z-index: 1200; margin: 0;
        background: #171613; overflow: auto; display: flex; flex-direction: column;
        align-items: center; box-shadow: 0 0 0 40px rgba(0,0,0,.7);
      }
      .radar-expanded .radar-chart { width: min(100%, 640px); height: min(62vh, 640px); min-height: 260px; }
      .radar-expanded .radar-head { width: 100%; }
      .radar-expanded > small { max-width: 640px; }

      .radar-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .radar-head span,
      .aspect-heading span {
        color: var(--muted);
        font-size: 13px;
        font-weight: 900;
      }

      .radar-head strong {
        color: var(--orange);
        font-size: 24px;
        line-height: 1;
      }

      .radar-chart {
        width: 100%;
        aspect-ratio: 1;
        min-height: 220px;
      }

      .radar-chart svg {
        width: 100%;
        height: 100%;
        display: block;
        overflow: visible;
      }

      .radar-label {
        fill: rgba(246, 234, 213, 0.80);
        font-size: 14px;
        font-weight: 850;
      }

      .radar-score-label {
        fill: rgba(240, 162, 58, 0.92);
        font-size: 12px;
        font-weight: 950;
      }

      .radar-summary {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .radar-chip {
        border-radius: 999px;
        padding: 4px 7px;
        background: rgba(118, 215, 208, 0.10);
        color: rgba(246, 234, 213, 0.78);
        font-size: 12px;
        font-weight: 800;
      }

      .detail-main {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-width: 0;
        max-height: inherit;
      }

      .detail-head {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 18px 12px;
        border-bottom: 1px solid var(--line);
      }

      .detail-head h2 {
        font-size: clamp(24px, 3vw, 40px);
        line-height: 1.05;
      }

      .detail-head p {
        margin-top: 8px;
        color: var(--muted);
      }

      .close-button {
        width: 40px;
        height: 40px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.04);
        cursor: pointer;
        font-size: 22px;
      }

      .detail-form {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        padding: 18px;
        overflow: auto;
      }

      .field {
        display: grid;
        gap: 7px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      .field label {
        color: var(--muted);
        font-size: 13px;
        font-weight: 850;
      }

      .aspect-section {
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.030);
      }

      .aspect-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .aspect-heading small {
        color: var(--soft);
        font-size: 12px;
      }

      .aspect-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .aspect-field {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
      }

      .aspect-field label,
      .aspect-field output {
        font-size: 13px;
        font-weight: 900;
      }
      .aspect-field .emotion-choice { justify-self:start; width:auto; min-height:32px; padding:3px 8px; color:var(--orange); font-size:13px; font-weight:900; border:1px solid var(--line-bright); border-radius:7px; background:var(--bg); }

      .break-slider { grid-column:1/-1; position:relative; height:48px; touch-action:none; user-select:none; cursor:ew-resize; }
      .break-slider input { position:absolute; left:10px; top:0; width:calc(100% - 82px); height:42px; opacity:0; margin:0; padding:0!important; }
      .break-track { position:absolute; left:10px; right:72px; top:20px; height:4px; border-radius:4px; background:rgba(246,234,213,.2); pointer-events:none; }
      .break-fill { position:absolute; inset:0 auto 0 0; width:var(--progress,50%); background:var(--orange); border-radius:4px; }
      .break-stop { position:absolute; right:-1px; top:-7px; height:18px; width:2px; background:var(--orange); transform:rotate(var(--bend,0deg)); box-shadow:0 0 var(--glow,0px) var(--red); }
      .break-thumb { position:absolute; top:50%; left:var(--progress,50%); width:17px; height:17px; border-radius:50%; background:var(--orange); border:2px solid #33281a; transform:translate(calc(-50% + var(--extra,0px)),-50%) scaleX(var(--stretch,1)); }
      .break-tail { position:absolute; left:100%; top:0; height:4px; width:var(--extra,0px); background:var(--red); box-shadow:0 0 9px rgba(232,75,106,.4); }
      .break-zero,.break-ten { position:absolute; top:30px; font-size:10px; color:var(--soft); pointer-events:none; }.break-zero{left:8px}.break-ten{right:66px}
      .break-slider:focus-within .break-thumb{outline:2px solid var(--blue);outline-offset:3px}
      .break-slider.broken .break-stop { transform:rotate(32deg); height:9px; background:var(--red); box-shadow:3px 10px 0 var(--red); }
      .break-slider.broken .break-thumb { background:var(--red); box-shadow:0 0 14px rgba(232,75,106,.55); }
      .break-slider.burst .break-stop{animation:break-flash .35s ease-out}
      @keyframes break-flash{50%{filter:brightness(2.5);transform:rotate(60deg) scale(1.4)}}
      @media(prefers-reduced-motion:reduce){.break-slider.burst .break-stop{animation:none}}

      .aspect-field label {
        color: rgba(246, 234, 213, 0.78);
      }

      .aspect-field output {
        color: var(--orange);
        text-align: right;
      }

      .field input,
      .field select {
        min-height: 42px;
        padding: 0 11px;
      }

      .field textarea {
        min-height: 110px;
        resize: vertical;
        padding: 11px;
        line-height: 1.6;
      }

      .rating-line {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 14px;
        align-items: center;
      }

      input[type="range"] {
        accent-color: var(--orange);
      }

      .rating-value {
        min-width: 52px;
        color: var(--orange);
        font-size: 24px;
        font-weight: 950;
        text-align: right;
      }

      .detail-actions {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 18px 18px;
        border-top: 1px solid var(--line);
      }

      .danger {
        border-color: rgba(232, 75, 106, 0.42);
        color: #ff9caf;
      }

      .file-input {
        display: none;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        z-index: 40;
        display: none;
        transform: translateX(-50%);
        padding: 10px 14px;
        border: 1px solid var(--line-bright);
        border-radius: 8px;
        background: rgba(10, 10, 9, 0.90);
        color: var(--text);
        box-shadow: var(--shadow);
      }

      .toast.show {
        display: block;
      }

      .library-panel {
        width: min(980px, 100%);
        max-height: min(860px, calc(100vh - 48px));
        overflow: auto;
        border: 1px solid rgba(255, 236, 205, 0.18);
        border-radius: 8px;
        background: var(--panel-strong);
        box-shadow: 0 30px 120px rgba(0, 0, 0, 0.72);
      }

      .library-body {
        display: grid;
        gap: 14px;
        padding: 18px;
      }

      .library-search-form {
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr) auto;
        gap: 10px;
      }

      .library-search-form input,
      .library-search-form select,
      .api-settings input {
        min-height: 46px;
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 12px;
        background: rgba(0, 0, 0, 0.24);
        color: var(--text);
      }

      .library-message {
        min-height: 22px;
        color: var(--muted);
        font-size: 14px;
      }

      .library-results {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 12px;
      }

      .library-result {
        display: grid;
        gap: 8px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.035);
        color: var(--text);
        text-align: left;
        cursor: pointer;
      }

      .library-result:hover {
        border-color: var(--line-bright);
        transform: translateY(-1px);
      }

      .library-result .poster {
        aspect-ratio: 2 / 3;
      }

      .library-result strong {
        overflow-wrap: anywhere;
        line-height: 1.35;
      }

      .library-result small {
        color: var(--muted);
        line-height: 1.45;
      }

      .album-result { display: grid; gap: 6px; align-content: start; min-width: 0; }
      .album-result .poster { aspect-ratio: 1; }
      .album-result a { color: var(--blue); font-size: 13px; }

      .api-settings {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--muted);
      }

      .api-settings summary {
        cursor: pointer;
        font-weight: 850;
      }

      .api-key-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 12px;
      }

      .api-key-grid label {
        display: grid;
        gap: 6px;
        font-size: 13px;
      }

      .library-foot {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
      }

      @media (max-width: 980px) {
        .app {

          <section>

                <span class="count-pill">备份</span>
              </button>
              <button class="tool-button" id="importButton" type="button">
                <span>导入 JSON</span>
                <span class="count-pill">恢复</span>
              </button>
              <button class="tool-button" id="resetButton" type="button">
                <span>清空本机</span>
                <span class="count-pill">重置</span>
              </button>
              <input class="file-input" id="fileInput" type="file" accept="application/json" />
            </div>
          </section>
        </aside>

        <section class="workspace">
          <header class="topbar">
            <label class="search" aria-label="搜索作品">
              <input id="searchInput" type="search" placeholder="搜索标题、作者、标签、短评..." />
            </label>
            <label class="control">
              <select id="statusFilter" aria-label="状态筛选">
                <option value="all">全部状态</option>
                <option value="看过">看过</option>
                <option value="想看">想看</option>
                <option value="在看">在看</option>
                <option value="玩过">玩过</option>
                <option value="在玩">在玩</option>
                <option value="想玩">想玩</option>
                <option value="读过">读过</option>
                <option value="在读">在读</option>
                <option value="想读">想读</option>
                <option value="听过">听过</option>
                <option value="在听">在听</option>

            <div>

                <option value="rating">评分最高</option>
                <option value="year">年份最新</option>

                <button class="icon-button" id="listView" type="button" title="列表">☰</button>

            </div>
          </div>

          <div class="gallery-wrap">
            <section id="collectionTools" aria-label="分类与个人榜单"></section>
            <div class="gallery" id="gallery"></div>
          </div>
        </section>
      </div>
    </main>

    <section class="detail" id="librarySearch" aria-hidden="true">
      <div class="library-panel" role="dialog" aria-modal="true" aria-labelledby="libraryTitle">
        <header class="detail-head">
          <div>
            <h2 id="libraryTitle">搜索资料库</h2>
            <p>搜到作品后点一下，资料会自动填好。</p>
          </div>
          <button class="close-button" id="libraryCloseButton" type="button" aria-label="关闭">×</button>
        </header>
        <div class="library-body">
          <form class="library-search-form" id="librarySearchForm">
            <select id="libraryCategory" aria-label="作品分类"></select>
            <input id="libraryQuery" type="search" placeholder="输入作品名，例如 千与千寻" autocomplete="off" required />

          </form>
          <div class="library-message" id="libraryMessage">选择分类，输入名字开始搜索。</div>
          <div class="library-results" id="libraryResults"></div>
          <details class="api-settings">
            <summary>电影与游戏资料库设置（只需一次）</summary>
            <div class="api-key-grid">
              <label>TMDB API Key（电影）<input id="tmdbKey" type="password" autocomplete="off" placeholder="免费申请的 API Key" /><a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noreferrer">申请 TMDB Key</a></label>
              <label>RAWG API Key（游戏）<input id="rawgKey" type="password" autocomplete="off" placeholder="免费申请的 API Key" /><a href="https://rawg.io/apidocs" target="_blank" rel="noreferrer">申请 RAWG Key</a></label>

          </details>
          <div class="library-foot">
            <small>密钥只保存在当前浏览器，不会上传到作品柜。</small>
            <button class="ghost-button" id="manualAddButton" type="button">手动添加</button>

        </div>
      </div>
    </section>

            <div class="field">

                <option>看过</option>
                <option>在玩</option>
                <option>想玩</option>
                <option>玩过</option>
                <option>在读</option>
                <option>想读</option>
                <option>读过</option>
                <option>听过</option>
                <option>在听</option>
                <option>想听</option>
              </select>
            </div>
            <div class="field">
              <label for="creatorField">作者 / 导演 / 制作方</label>
              <input id="creatorField" name="creator" />
            </div>
            <div class="field">
              <label for="yearField">年份</label>
              <input id="yearField" name="year" inputmode="numeric" />
            </div>
            <div class="field full">
              <label for="posterField">封面 URL</label>
              <input id="posterField" name="poster" placeholder="https://..." />
            </div>
            <div class="field">
              <label for="languagesField">语言（可多选、自定义）</label>
              <input id="languagesField" list="languageSuggestions" placeholder="普通话, 粤语；用逗号分隔" />

            <div class="field">

      function getMetrics(category, emotionMode = "emotion") {
        const metrics = metricSets[category] || metricSets.default;
        return category === "专辑" && emotionMode === "awe"
          ? metrics.map(metric => metric.key === "emotion" ? {...metric,label:"震撼"} : metric) : metrics;

      function renderAspectControls(category, scores = {}) {
        const metrics = getMetrics(category, state.editingEmotionMode);
        el.aspectHint.textContent = "10 分满分。到顶不松手，继续向右拉，可突破边界。";

          const row = document.createElement("div");

          input.step = "0.1";

          input.setAttribute("aria-label",metric.label);
          input.dataset.unscored = String(scores[metric.key] == null);
          input.value = scores[metric.key] == null ? "5" : Math.min(10,clampScore(scores[metric.key])).toFixed(1);
          input.dataset.actualScore = String(scores[metric.key] ?? 5);
          input.setAttribute("aria-valuetext", formatAspectScore(scores[metric.key]));

          const output = document.createElement("output");
          output.htmlFor = input.id;
          output.dataset.aspectOutput = metric.key;
          output.textContent = formatBreakScore(scores[metric.key]);

          const slider=createBreakSlider(input);
          if (category === "专辑" && metric.key === "emotion") {
            const choice=document.createElement("select");choice.className="emotion-choice";
            choice.setAttribute("aria-label","这个维度评价感动还是震撼");

              renderRadar({category,aspectScores:getCurrentAspectScores()});

          el.aspectFields.append(row);
        });
      }

      function formatBreakScore(value) {
        return value == null ? "待评" : value > 10 ? `10 + ${(clampScore(value)-10).toFixed(1)} · 破格` : clampScore(value).toFixed(1);
      }

      function syncBreakSlider(input, value, unscored = false) {
        value=clampScore(value);
        input.value=String(Math.min(10,value)); input.dataset.actualScore=String(value);
        input.dataset.unscored=String(unscored);
        input.setAttribute("aria-valuetext",unscored ? "待评" : formatBreakScore(value));
        const slider=input.parentElement;
        if (!slider?.classList.contains("break-slider"))return;
        slider.style.setProperty("--progress",`${Math.min(10,value)*10}%`);
        slider.style.setProperty("--extra",`${Math.max(0,value-10)/5*44}px`);
        slider.classList.toggle("broken",value>10);
        slider.title=value===10?"还不够？继续向右拉。键盘可用 Shift + 右方向键破格加分。":"";
      }

      function breakDragValue(x, track, gesture) {
        if (x<=track.right) {gesture.broken=false;gesture.gate=track.right;return {value:Math.round(Math.max(0,(x-track.left)/track.width)*100)/10,pressure:0};}
        const distance=Math.max(0,x-gesture.gate);
        if(!gesture.broken && distance<16)return {value:10,pressure:distance/16};
        if(!gesture.broken){gesture.broken=true;gesture.origin=gesture.gate+16;}
        return {value:Math.round(clampScore(10+Math.max(0,x-gesture.origin)/44*5)*10)/10,pressure:0};
      }

      function createBreakSlider(input) {
        const slider=document.createElement("div");slider.className="break-slider";
        const track=document.createElement("div");track.className="break-track";
        for(const name of ["break-fill","break-tail","break-stop","break-thumb"]){const part=document.createElement("span");part.className=name;track.append(part);}
        const zero=document.createElement("span");zero.className="break-zero";zero.textContent="0";
        const ten=document.createElement("span");ten.className="break-ten";ten.textContent="10";
        slider.append(input,track,zero,ten);
        syncBreakSlider(input,Number(input.dataset.actualScore),input.dataset.unscored==="true");
        let gesture=null;
        const commit=value=>{
          syncBreakSlider(input,value);updateAspectOutput(input.dataset.aspectKey,value);
          renderRadar({category:el.categoryField.value,rating:Number(el.ratingField.value||0),aspectScores:getCurrentAspectScores()});
        };
        const feedback=pressure=>{slider.style.setProperty("--stretch",1+pressure*.4);slider.style.setProperty("--glow",`${pressure*18}px`);slider.style.setProperty("--bend",`${pressure*18}deg`);};
        const move=event=>{
          if(!gesture || event.pointerId!==gesture.pointerId)return;
          const wasBroken=gesture.broken;const result=breakDragValue(event.clientX,gesture.track,gesture);
          feedback(result.pressure);commit(result.value);
          if(!wasBroken && gesture.broken){slider.classList.add("burst");setTimeout(()=>slider.classList.remove("burst"),400);}
        };
        slider.addEventListener("pointerdown",event=>{
          if(event.button!=null && event.button!==0)return;
          const rect=track.getBoundingClientRect();if(rect.width<=0)return;
          event.preventDefault();input.focus({preventScroll:true});
          const over=Number(input.dataset.actualScore)>10 && event.clientX>rect.right;
          gesture={pointerId:event.pointerId,track:rect,gate:Math.max(rect.right,event.clientX),origin:rect.right,broken:over};
          slider.setPointerCapture(event.pointerId);
          if(over)move(event);else commit(Math.round(Math.max(0,Math.min(10,(event.clientX-rect.left)/rect.width*10))*10)/10);
        });
        slider.addEventListener("pointermove",move);
        const finish=event=>{
          if(!gesture || event.pointerId!==gesture.pointerId)return;
          gesture=null;feedback(0);if(slider.hasPointerCapture(event.pointerId))slider.releasePointerCapture(event.pointerId);
        };
        slider.addEventListener("pointerup",finish);slider.addEventListener("pointercancel",finish);
        slider.addEventListener("lostpointercapture",()=>{gesture=null;feedback(0);});
        input.addEventListener("keydown",event=>{
          const value=Number(input.dataset.actualScore);
          if(event.shiftKey && event.key==="ArrowRight" && value>=10){event.preventDefault();commit(Math.round(clampScore(value+.1)*10)/10);}
          else if(value>10 && ["ArrowLeft","ArrowDown","ArrowRight","ArrowUp","Home","End"].includes(event.key)){
            event.preventDefault();const next=event.key==="Home"?0:event.key==="End"?10:value+(["ArrowLeft","ArrowDown"].includes(event.key)?-.1:.1);commit(Math.round(clampScore(next)*10)/10);
          }
        });
        return slider;
      }

      function normalizeLibraryItem(item) {

      async function fetchJson(url, options) {

      async function searchAniList(query, category) {
        const mediaType = category === "动漫" ? "ANIME" : "MANGA";
        const graphQuery = `query ($search: String, $type: MediaType) {
          Page(page: 1, perPage: 12) {
            media(search: $search, type: $type, sort: SEARCH_MATCH) {
              id title { native romaji english }
              coverImage { extraLarge large }
              startDate { year }
              staff(perPage: 2, sort: RELEVANCE) { nodes { name { full } } }
              studios(isMain: true, perPage: 2) { nodes { name } }
            }
          }
        }`;
        const data = await fetchJson("https://graphql.anilist.co", {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({ query: graphQuery, variables: { search: query, type: mediaType } })
        });
        return (data.data?.Page?.media || []).map(media => {
          const studio = media.studios?.nodes?.map(node => node.name).join(" / ");
          const staff = media.staff?.nodes?.map(node => node.name.full).join(" / ");
          return normalizeLibraryItem({
            source: "AniList",
            sourceId: media.id,
            category,
            title: media.title.native || media.title.english || media.title.romaji,
            originalTitle: media.title.romaji || media.title.english || "",
            creator: category === "动漫" ? (studio || staff) : staff,
            year: media.startDate?.year,
            poster: media.coverImage?.extraLarge || media.coverImage?.large || ""
          });
        });
      }

      const albumCache = new Map();
      let appleNextRequest = 0;
      let musicBrainzNextRequest = 0;
      let albumSearchVersion = 0;

      // Verified artist identity: musicbrainz.org/artist/7e4448d1-4ee1-40fa-9f81-38fa6caa131e
      const softLipaNames = ["蛋堡", "Soft Lipa", "Softlipa", "杜振熙", "蛋堡Soft Lipa"];
      const albumText = value => String(value || "").normalize("NFKC").toLowerCase()
        .replace(/[\s\p{P}\p{S}]/gu, "");
      const isSoftLipa = value => softLipaNames.some(name => albumText(name) === albumText(value));
      // A small verified supplement, not a claim of a complete offline catalogue.
      // Metadata: MusicBrainz release bf6dda80-e085-4afa-9711-249b4fe99ec1.
      const albumSupplement = [{
        source: "华语补充·任性的人", sourceId: "rsdr-96", category: "专辑",
        title: "家常音樂", originalTitle: "家常音乐", creator: "蛋堡", year: "2020",
        poster: "https://coverartarchive.org/release/bf6dda80-e085-4afa-9711-249b4fe99ec1/front-500",
        sourceUrl: "https://rsdr.online/digital/96"
      }, ...[
        ["0164d77e-0e07-42e4-9f28-c03b39a8ece5", "收斂水", "收敛水", "蛋堡", "2009"],
        ["e6e030f0-07a7-429f-82e8-4ea22bea4ce4", "Winter Sweet", "", "蛋堡", "2009"],
        ["f387340b-c582-4057-9fe2-5362b4a0b38b", "月光", "", "JABBERLOOP / Soft Lipa", "2010"],
        ["12936847-334b-4851-bd25-d4c7889d5037", "踩腳踏車", "踩脚踏车", "蛋堡 / Shin‐Ski", "2011"],
        ["f1bf800c-8948-4113-bec2-fa0be2dcae58", "你所不知道的杜振熙之内部整修", "你所不知道的杜振熙之內部整修", "杜振熙", "2013"],
        ["41896897-31fd-4ad2-b7a8-dfc522ef9ce5", "運河", "运河", "蛋堡", "2026"]
      ].map(([sourceId, title, originalTitle, creator, year]) => ({
        source: "MusicBrainz·华语补充", sourceId, category: "专辑", title, originalTitle, creator, year,
        poster: `https://coverartarchive.org/release-group/${sourceId}/front-500`,
        sourceUrl: `https://musicbrainz.org/release-group/${sourceId}`
      }))];

      function searchAlbumSupplement(query) {
        const tokens = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
        return albumSupplement.filter(item => isSoftLipa(query) || tokens.every(token =>
          albumText([item.title, item.originalTitle, item.creator, ...softLipaNames].join(" "))
            .includes(albumText(token)))).map(normalizeLibraryItem);
      }

      function albumIdentity(item) {
        const clean = value => String(value || "").normalize("NFKC").toLowerCase()
          .replace(/[\s\p{P}\p{S}]/gu, "");
        const title = clean(item.title).replaceAll("家常音乐", "家常音樂");
        return `${title}|${isSoftLipa(item.creator) ? "softlipa" : clean(item.creator)}`;
      }

      function mergeAlbums(items) {
        const seen = new Set();
        return items.filter(item => {
          const key = albumIdentity(item);
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      }

      // Fixed provider endpoints only; JSONP avoids third-party CORS proxies.
      function albumJsonp(provider, endpoint, params, resultField) {
        return new Promise((resolve, reject) => {
          const callback = `cabinetAlbums_${crypto.randomUUID().replaceAll("-", "")}`;
          const script = document.createElement("script");
          let settled = false;
          const finish = (error, value) => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            script.remove();
            // A timed-out script may still finish; make its late callback harmless.
            window[callback] = () => {};
            setTimeout(() => { delete window[callback]; }, 60000);
            error ? reject(error) : resolve(value);
          };
          const timer = setTimeout(() => finish(new Error(`${provider} 连接超时`)), 10000);
          window[callback] = data => {
            if (!Array.isArray(data?.[resultField])) return finish(new Error(`${provider} 返回异常`));
            finish(null, data[resultField]);
          };
          script.onerror = () => finish(new Error(`${provider} 暂时无法连接`));
          script.referrerPolicy = "no-referrer";
          script.src = `${endpoint}?${new URLSearchParams({ ...params, callback })}`;
          document.head.append(script);
        });
      }

      function appleAlbumRequest(query, country) {
        return albumJsonp("Apple", "https://itunes.apple.com/search", {
          term: query, country, media: "music", entity: "album", limit: "100"
        }, "results");
      }

      async function searchDeezerAlbums(query) {
        const results = await albumJsonp("Deezer", "https://api.deezer.com/search/album", {
          q: isSoftLipa(query) ? "Soft Lipa" : query, limit: "100", output: "jsonp"
        }, "data");
        return results.filter(album => album.id && album.title).map(album => normalizeLibraryItem({
          source: "Deezer", sourceId: album.id, category: "专辑",
          title: album.title, creator: album.artist?.name || "",
          year: String(album.release_date || "").slice(0, 4),
          poster: album.cover_big || album.cover_medium || "",
          sourceUrl: album.link || `https://www.deezer.com/album/${album.id}`
        }));
      }

      async function searchAppleAlbums(query, country) {
        const wait = Math.max(0, appleNextRequest - Date.now());
        appleNextRequest = Date.now() + wait + 3500;
        if (wait) await new Promise(resolve => setTimeout(resolve, wait));
        const results = await appleAlbumRequest(query, country);
        return results.map(album => normalizeLibraryItem({
          source: "Apple", sourceId: album.collectionId, category: "专辑",
          title: album.collectionName, creator: album.artistName,
          year: String(album.releaseDate || "").slice(0, 4),
          genres: album.primaryGenreName ? [album.primaryGenreName] : [],
          poster: album.artworkUrl100 || "",
          sourceUrl: album.collectionViewUrl || ""
        }));
      }

      async function searchMusicBrainzAlbums(query) {
        if (Date.now() < musicBrainzNextRequest) throw new Error("MusicBrainz 正在冷却，请稍后再试");
        musicBrainzNextRequest = Date.now() + 1200;
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 10000);
        let data;
        try {
          const expression = isSoftLipa(query) ? "arid:7e4448d1-4ee1-40fa-9f81-38fa6caa131e" : query;
          const url = `https://musicbrainz.org/ws/2/release-group/?query=${encodeURIComponent(expression)}&fmt=json&limit=100`;
          const response = await fetch(url, { signal: controller.signal });
          if (!response.ok) {
            if (response.status === 429 || response.status === 503) {
              const retry = response.headers.get("Retry-After");
              const delay = /^\d+$/.test(retry || "") ? Number(retry) * 1000 : Date.parse(retry || "") - Date.now();
              musicBrainzNextRequest = Date.now() + Math.max(30000, Number.isFinite(delay) ? delay : 0);
            }
            throw new Error(`MusicBrainz 暂时不可用（${response.status}）`);
          }
          data = await response.json();
          if (!Array.isArray(data["release-groups"])) throw new Error("MusicBrainz 返回异常");
        } finally {
          clearTimeout(timer);
        }
        return data["release-groups"].map(album => normalizeLibraryItem({
          source: "MusicBrainz",
          sourceId: album.id,
          category: "专辑",
          title: album.title,
          creator: (album["artist-credit"] || []).map(credit => credit.name).join(" / "),
          year: String(album["first-release-date"] || "").slice(0, 4),
          poster: `https://coverartarchive.org/release-group/${album.id}/front-500`,
          sourceUrl: `https://musicbrainz.org/release-group/${album.id}`
        }));
      }

      async function searchAlbums(query, onProgress = () => {}) {
        const cacheKey = query.trim().normalize("NFKC").toLowerCase();
        const cached = albumCache.get(cacheKey);
        if (cached && Date.now() - cached.time < (cached.partial ? 30000 : 600000)) {
          onProgress(cached.items, `已找到 ${cached.items.length} 张专辑（缓存）。${cached.partial ? "部分资料源上次连接失败。" : ""}点封面评分。`);
          return cached.items;
        }
        let items = searchAlbumSupplement(query), done = 0;
        onProgress(items, items.length ? "已找到华语补充条目，正在搜索在线资料源，可以先点选。" : "正在搜索多个专辑资料源…");
        const failures = [];
        const countries = /[\u3400-\u9fff]/.test(query) || isSoftLipa(query)
          ? ["TW", "CN", "HK", "US"] : ["US", "TW"];
        const sources = [
          ...countries.map(country => [`Apple ${country}`, () => searchAppleAlbums(query, country)]),
          ["Deezer", () => searchDeezerAlbums(query)],
          ["MusicBrainz", () => searchMusicBrainzAlbums(query)]
        ];
        if (isSoftLipa(query)) {
          const alternate = /soft/i.test(query) ? "蛋堡" : "Soft Lipa";
          sources.push(["Apple 艺人别名", () => searchAppleAlbums(alternate, "TW")]);
        }
        // Reserve one Apple request every 3.5 seconds across searches.
        await Promise.all(sources.map(async ([name, request]) => {
          try { items = mergeAlbums([...items, ...await request()]); }
          catch { failures.push(name); }
          done++;
          const suffix = done < sources.length ? "其余资料源仍在搜索，可以先点选。"
            : failures.length ? `暂未连通：${failures.join("、")}；已保留可用结果。` : "点封面直接评分。";
          onProgress(items, `已找到 ${items.length} 张专辑。${suffix}`);
        }));
        if (items.length) {
          albumCache.set(cacheKey, { time: Date.now(), items, partial: failures.length > 0 });
          if (albumCache.size > 30) albumCache.delete(albumCache.keys().next().value);
        } else if (failures.length) {
          onProgress([], "资料源暂时未能完整连接，不能判断是否收录。稍后重试，或用艺人名＋专辑名搜索。");
        } else onProgress([], "已连接的资料源未找到，试试艺人名、专辑原名或其他译名。");
        return items;
      }

      async function searchMovies(query) {

        if (!key) throw new Error("请展开下方设置，先填入免费的 TMDB API Key。");
        saveApiSettings();

        return (data.results || []).slice(0, 12).map(movie => normalizeLibraryItem({

        }));

      async function searchGames(query) {
        const key = el.rawgKey.value.trim();
        if (!key) throw new Error("请展开下方设置，先填入免费的 RAWG API Key。");
        saveApiSettings();
        const url = `https://api.rawg.io/api/games?key=${encodeURIComponent(key)}&search=${encodeURIComponent(query)}&page_size=12&search_precise=true`;
        const data = await fetchJson(url);
        return (data.results || []).map(game => normalizeLibraryItem({
          source: "RAWG",
          sourceId: game.id,
          category: "游戏",
          title: game.name,
          year: String(game.released || "").slice(0, 4),
          poster: game.background_image || "",
          tags: (game.platforms || []).slice(0, 3).map(entry => entry.platform?.name).filter(Boolean)
        }));
      }

      async function searchExternalLibrary(query, category) {
        if (category === "书籍") return searchBooks(query);
        if (category === "动漫" || category === "漫画") return searchAniList(query, category);
        if (category === "专辑") return searchAlbums(query);
        if (category === "电影") return searchMovies(query);
        if (category === "游戏") return searchGames(query);
        return [];
      }

      function renderLibraryResults(items) {
        el.libraryResults.replaceChildren(...items.map(item => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "library-result";
          button.append(createPoster(item));
          const title = document.createElement("strong");
          title.textContent = item.title;
          const meta = document.createElement("small");
          meta.textContent = [item.creator, item.year, item.source].filter(Boolean).join(" · ");
          button.append(title, meta);
          button.addEventListener("click", () => selectLibraryResult(item));
          if (item.category === "专辑" && /^https:\/\/(musicbrainz\.org|music\.apple\.com|itunes\.apple\.com|www\.deezer\.com|deezer\.com|rsdr\.online)\//.test(item.sourceUrl || "")) {
            const wrapper = document.createElement("div");
            wrapper.className = "album-result";
            const link = document.createElement("a");
            link.href = item.sourceUrl;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = `在 ${item.source} 查看专辑`;
            wrapper.append(button, link);
            return wrapper;
          }
          return button;
        }));
      }

      function selectLibraryResult(item) {
        const duplicate = state.items.find(entry =>
          (item.sourceId && entry.source === item.source && entry.sourceId === item.sourceId) ||
          (entry.category === item.category && normalizeText(entry.title) === normalizeText(item.title) &&
            (item.category !== "专辑" || normalizeText(entry.creator) === normalizeText(item.creator)))
        );
        closeLibrarySearch();
        if (duplicate) {
          showToast("作品柜里已经有这条，已打开原记录");
          openDetail(duplicate.id);
          return;
        }
        openDetail(item);
      }

      async function runLibrarySearch() {
        if (state.libraryBusy) return;
        const query = el.libraryQuery.value.trim();
        const category = el.libraryCategory.value;
        if (!query) return;
        state.libraryBusy = true;
        const searchVersion = ++albumSearchVersion;
        el.libraryMessage.textContent = "正在搜索…";
        el.libraryResults.replaceChildren();
        try {
          if (category === "专辑") {
            await searchAlbums(query, (items, message) => {
              if (searchVersion !== albumSearchVersion) return;
              renderLibraryResults(items);
              el.libraryMessage.textContent = message;
            });
            return;
          }
          const items = await searchExternalLibrary(query, category);
          if (searchVersion !== albumSearchVersion) return;
          renderLibraryResults(items);
          el.libraryMessage.textContent = items.length ? `找到 ${items.length} 条，点一项直接评分。` : "没有找到，换个名字试试。";
        } catch (error) {
          el.libraryMessage.textContent = error.message || "搜索失败，请稍后重试。";
        } finally {
          state.libraryBusy = false;
        }
      }

      function loadItems() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : null;
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return [];
        }
      }

      function saveItems() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.items));
        saveRankings();
      }

      function clampScore(value, fallback = 0) {
        const number = Number(value);
        if (!Number.isFinite(number)) return fallback;
        return Math.max(0, Math.min(15, number));
      }

      function getAspectScores(item = {}) {
        const source =
          item.aspectScores && typeof item.aspectScores === "object" && !Array.isArray(item.aspectScores)
            ? item.aspectScores
            : {};
        const metrics = getMetrics(item.category);
        return metrics.reduce((scores, metric) => {
          const saved = source[metric.key];
          scores[metric.key] = saved != null && saved !== "" && Number.isFinite(Number(saved))
            ? clampScore(saved)
            : null;
          return scores;
        }, { ...source });
      }

      function formatAspectScore(value) {
        return value == null ? "待评" : clampScore(value).toFixed(1);
      }

      function averageAspectScores(scores, category) {
        const values = getMetrics(category).map(metric => scores[metric.key])
          .filter(value => value != null).map(value => clampScore(value));
        return values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : null;
      }

      function getCurrentAspectScores() {
        return Array.from(el.aspectFields.querySelectorAll("[data-aspect-key]")).reduce((scores, input) => {
          scores[input.dataset.aspectKey] = input.dataset.unscored === "true" ? null : clampScore(input.dataset.actualScore ?? input.value, 0);
          return scores;
        }, {});
      }

      function setAspectControls(scores) {
        el.aspectFields.querySelectorAll("[data-aspect-key]").forEach(input => {
          const key = input.dataset.aspectKey;
          const value = scores[key];
          const output = el.aspectFields.querySelector(`[data-aspect-output="${key}"]`);
          syncBreakSlider(input,value ?? 5,value==null);
          if (output) output.textContent = formatBreakScore(value);
        });
      }

      function updateAspectOutput(key, value) {
        const output = el.aspectFields.querySelector(`[data-aspect-output="${key}"]`);
        if (output) output.textContent = formatBreakScore(value);
      }

      function makeSvgElement(name, attributes = {}) {
        const element = document.createElementNS("http://www.w3.org/2000/svg", name);
        Object.entries(attributes).forEach(([key, value]) => element.setAttribute(key, value));
        return element;
      }

      function radarPoint(index, value, total, radius = 92) {
        const angle = -Math.PI / 2 + (index * Math.PI * 2) / total;
        const distance = (clampScore(value, 0) / 10) * radius;
        return {
          x: 150 + Math.cos(angle) * distance,
          y: 150 + Math.sin(angle) * distance
        };
      }

      function radarPoints(scores, metrics, radius = 92) {
        return metrics
          .map((metric, index) => {
            const point = radarPoint(index, scores[metric.key], metrics.length, radius);
            return `${point.x.toFixed(2)},${point.y.toFixed(2)}`;
          })
          .join(" ");
      }

      function createRadarSvg(scores, category, interactive = false, emotionMode = "emotion") {
        const metrics = getMetrics(category, emotionMode);
        const svg = makeSvgElement("svg", {
          viewBox: "-65 -65 430 430",
          role: interactive ? "group" : "img",
          "aria-label": `${category || "作品"}八维评分雷达图`
        });

        [0.25, 0.5, 0.75, 1].forEach(scale => {
          svg.append(
            makeSvgElement("polygon", {
              points: radarPoints(
                metrics.reduce((acc, metric) => {
                  acc[metric.key] = scale * 10;
                  return acc;
                }, {}),
                metrics,
                92
              ),
              fill: "none",
              stroke: scale === 1 ? "rgba(240,162,58,0.75)" : "rgba(246,234,213,0.12)",
              "stroke-width": scale === 1 ? "1.4" : "1"
            })
          );
        });

        metrics.forEach((metric, index) => {
          const end = radarPoint(index, 10, metrics.length, 92);
          const label = radarPoint(index, 10, metrics.length, 155);
          const scoreLabel = radarPoint(index, 10, metrics.length, 72);
          svg.append(
            makeSvgElement("line", {
              x1: "150",
              y1: "150",
              x2: end.x.toFixed(2),
              y2: end.y.toFixed(2),
              stroke: "rgba(246,234,213,0.13)",
              "stroke-width": "1"
            })
          );
          const labelText = makeSvgElement("text", {
            x: label.x.toFixed(2),
            y: label.y.toFixed(2),
            "text-anchor": label.x < 132 ? "end" : label.x > 168 ? "start" : "middle",
            "dominant-baseline": "middle",
            class: "radar-label"
          });
          labelText.textContent = metric.label;
          svg.append(labelText);

          const scoreText = makeSvgElement("text", {
            x: scoreLabel.x.toFixed(2),
            y: scoreLabel.y.toFixed(2),
            "text-anchor": "middle",
            "dominant-baseline": "middle",
            class: "radar-score-label"
          });
          scoreText.textContent = formatAspectScore(scores[metric.key]);
          scoreText.dataset.radarScore = metric.key;
          svg.append(scoreText);
        });

        const shape = makeSvgElement("polygon", {
            points: radarPoints(scores, metrics, 92),
            fill: "rgba(118,215,208,0.22)",
            stroke: "rgba(118,215,208,0.92)",
            "stroke-width": "2.2"
          });
        svg.append(shape);

        metrics.forEach((metric, index) => {
          if (scores[metric.key] == null && !interactive) return;
          const point = radarPoint(index, scores[metric.key] ?? 5, metrics.length, 92);
          const handle = makeSvgElement("circle", {
              cx: point.x.toFixed(2),
              cy: point.y.toFixed(2),
              r: interactive ? "9" : "3.4",
              fill: scores[metric.key] == null ? "#26231e" : scores[metric.key] > 10 ? "#e84b6a" : "#f0a23a",
              stroke: "rgba(0,0,0,0.68)",
              "stroke-width": "1.5"
            });
          svg.append(handle);
          if (interactive) {
            handle.dataset.radarAxis = String(index);
            handle.setAttribute("tabindex", "0"); handle.setAttribute("role", "slider");
            handle.setAttribute("aria-label", `${metric.label}，可超过10分`);
            handle.setAttribute("aria-valuemin", "0"); handle.setAttribute("aria-valuemax", "15");
            handle.setAttribute("aria-valuenow", String(scores[metric.key] ?? 5));
            handle.setAttribute("aria-valuetext", formatAspectScore(scores[metric.key]));
            handle.style.cursor = "grab";
          }
        });
        if (interactive) attachRadarDrag(svg, shape, scores, category);
        return svg;
      }

      function radarValueAt(index, total, x, y) {
        const angle = -Math.PI / 2 + index * Math.PI * 2 / total;
        return Math.round(clampScore(((x - 150) * Math.cos(angle) + (y - 150) * Math.sin(angle)) / 92 * 10) * 10) / 10;
      }

      function attachRadarDrag(svg, shape, scores, category) {
        const metrics = getMetrics(category);
        svg.style.touchAction = "none"; svg.style.userSelect = "none";
        let dragging = null;
        const update = (index, value) => {
          const metric = metrics[index]; scores[metric.key] = clampScore(value);
          const input = el.aspectFields.querySelector(`[data-aspect-key="${metric.key}"]`);
          if (input) syncBreakSlider(input,scores[metric.key]);
          updateAspectOutput(metric.key, value);
          shape.setAttribute("points", radarPoints(scores, metrics, 92));
          const point = radarPoint(index, value, metrics.length, 92);
          const handle = svg.querySelector(`[data-radar-axis="${index}"]`);
          handle.setAttribute("cx",point.x); handle.setAttribute("cy",point.y); handle.setAttribute("fill",value > 10 ? "#e84b6a" : "#f0a23a");
          handle.setAttribute("aria-valuenow",value); handle.setAttribute("aria-valuetext",formatAspectScore(value));
          svg.querySelector(`[data-radar-score="${metric.key}"]`).textContent = formatAspectScore(value);
          renderRadarSummary(scores, category);
        };
        const move = event => {
          if (dragging == null) return;
          const matrix = svg.getScreenCTM(); if (!matrix) return;
          const p = svg.createSVGPoint(); p.x = event.clientX; p.y = event.clientY;
          const local = p.matrixTransform(matrix.inverse());
          update(dragging,radarValueAt(dragging,metrics.length,local.x,local.y));
        };
        svg.addEventListener("pointerdown", event => {
          const axis = event.target?.dataset?.radarAxis;
          if (axis == null || (event.button != null && event.button !== 0)) return;
          event.preventDefault(); dragging = Number(axis); svg.setPointerCapture(event.pointerId); move(event);
        });
        svg.addEventListener("pointermove",move);
        const finish = event => { dragging = null; if (svg.hasPointerCapture(event.pointerId)) svg.releasePointerCapture(event.pointerId); };
        svg.addEventListener("pointerup",finish); svg.addEventListener("pointercancel",finish);
        svg.addEventListener("lostpointercapture",() => { dragging = null; });
        svg.addEventListener("keydown",event => {
          const axis = event.target?.dataset?.radarAxis; if (axis == null) return;
          const index = Number(axis), value = scores[metrics[index].key] ?? 5, step = event.shiftKey ? 1 : 0.1;
          const next = {ArrowUp:value+step,ArrowRight:value+step,ArrowDown:value-step,ArrowLeft:value-step,Home:0,End:15}[event.key];
          if (next == null) return; event.preventDefault(); update(index,Math.round(clampScore(next)*10)/10);
        });
      }

      function renderRadar(item) {
        const scores = getAspectScores(item);
        el.detailRadar.replaceChildren(createRadarSvg(scores, item.category, true, state.editingEmotionMode));
        renderRadarSummary(scores, item.category);
      }

      function renderRadarSummary(scores, category) {
        const metrics = getMetrics(category, state.editingEmotionMode);
        el.radarAverage.textContent = formatAspectScore(averageAspectScores(scores, category));
        el.radarSummary.replaceChildren(
          ...metrics.map(metric => {
            const chip = document.createElement("span");
            chip.className = "radar-chip";
            chip.textContent = `${metric.label} ${formatAspectScore(scores[metric.key])}`;
            return chip;
          })
        );
      }

      function formatRating(value) {
        const number = Number(value);
        return number > 0 ? number.toFixed(number % 1 ? 1 : 0) : "未评";
      }

      function normalizeText(value) {
        return String(value ?? "").trim().toLowerCase();
      }

      function getFilteredItems() {
        const query = normalizeText(state.search);
        return state.items
          .filter(item => state.selectedCategory === "all" || item.category === state.selectedCategory)
          .filter(item => state.status === "all" || (state.status === "未听"
            ? item.category === "专辑" && (!item.status || item.status === "想听" || item.status === "未听")
            : item.status === state.status))
          .filter(matchesCollectionFilters)
          .filter(item => {
            if (!query) return true;
            return [
              item.title,
              item.originalTitle,
              item.creator,
              item.year,
              item.status,
              item.category,
              item.comment,
              ...(item.tags || [])
            ]
              .map(normalizeText)
              .some(text => text.includes(query));
          })
          .sort((a, b) => {
            if (state.sort === "rating") return Number(b.rating || 0) - Number(a.rating || 0);
            if (state.sort === "year") return Number(b.year || 0) - Number(a.year || 0);
            if (state.sort === "title") return String(a.title).localeCompare(String(b.title), "zh-CN");
            return new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0);
          });
      }

      function getCounts() {
        return categories.reduce((acc, category) => {
          acc[category.id] =
            category.id === "all"
              ? state.items.length
              : state.items.filter(item => item.category === category.id).length;
          return acc;
        }, {});
      }

      function renderCategoryList() {
        const counts = getCounts();
        el.categoryList.replaceChildren(
          ...categories.map(category => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = `category-button ${state.selectedCategory === category.id ? "active" : ""}`;
            button.innerHTML = `<span>${category.label}</span><span class="count-pill">${counts[category.id] || 0}</span>`;
            button.addEventListener("click", () => {
              state.selectedCategory = category.id;
              render();
            });
            return button;
          })
        );
      }

      function createPoster(item) {
        const poster = document.createElement("div");
        poster.className = "poster";
        const badge = document.createElement("span");
        badge.className = "rating-badge";
        badge.textContent = formatRating(item.rating);
        poster.append(badge);
        const fallback = createFallback(item.title);
        poster.append(fallback);
        if (item.poster) {
          const image = document.createElement("img");
          image.loading = "lazy";
          image.decoding = "async";
          image.referrerPolicy = "no-referrer";
          image.style.opacity = "0";
          image.style.position = "absolute";
          image.style.inset = "0";
          image.alt = `${item.title} 封面`;
          image.onload = () => { fallback.remove(); image.style.opacity = "1"; };
          image.onerror = () => {
            image.remove();
            fallback.title = "封面源暂时无法访问，可在作品详情更换封面 URL";
          };
          image.src = item.poster;
          poster.append(image);
        }
        return poster;
      }

      function createFallback(title) {
        const fallback = document.createElement("div");
        fallback.className = "poster-fallback";
        fallback.textContent = title;
        return fallback;
      }

      function renderGallery() {
        if (document.querySelector("#bulkRows")) renderBulkTools();
        const items = getFilteredItems();
        el.gallery.className = `gallery ${state.view}`;
        el.resultTitle.textContent = state.selectedCategory === "all" ? "全部作品" : state.selectedCategory;
        el.resultMeta.textContent = `${items.length} 条结果 · ${el.sortSelect.options[el.sortSelect.selectedIndex].text}`;

        if (!items.length) {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          empty.innerHTML = "<div><strong>这里还没有作品</strong><p>添加第一条作品，开始建立自己的评分柜。</p></div>";
          el.gallery.replaceChildren(empty);
          return;
        }

        el.gallery.replaceChildren(
          ...items.map(item => {
            const card = document.createElement("button");
            card.type = "button";
            card.className = "card";
            card.append(createPoster(item));
            const body = document.createElement("div");
            body.className = "card-body";
            body.innerHTML = `
              <div class="card-foot">
                <span class="type-pill">${item.category}</span>
                <span class="status-pill">${item.status || "未设置"}</span>
              </div>
              <h3>${escapeHtml(item.title)}</h3>
              <p class="meta">${escapeHtml([item.creator, item.year].filter(Boolean).join(" · "))}</p>
              <p class="card-comment">${escapeHtml(item.comment || "还没有短评。")}</p>
            `;
            card.append(body);
            card.addEventListener("click", () => openDetail(item.id));
            return card;
          })
        );
      }

      function renderStats() {
        const rated = state.items.filter(item => Number(item.rating) > 0);
        const average = rated.length
          ? rated.reduce((sum, item) => sum + Number(item.rating), 0) / rated.length
          : 0;
        el.totalCount.textContent = state.items.length;
        el.avgRating.textContent = rated.length ? average.toFixed(1) : "-";
      }

      function render() {
        renderCategoryList();
        renderStats();
        renderCollectionTools();
        renderGallery();
      }

      function openDetail(target) {
        const item =
          (target && typeof target === "object" ? target : state.items.find(entry => entry.id === target)) || {
            id: crypto.randomUUID(),
            title: "",
            originalTitle: "",
            category: "电影",
            status: "想看",
            creator: "",
            year: "",
            rating: 0,
            poster: "",
            tags: [],
            comment: "",
            aspectScores: {},
            updatedAt: new Date().toISOString()
          };
        state.editingId = item.id;
        state.editingEmotionMode = item.emotionMode === "awe" ? "awe" : "emotion";
        state.editingSource = { source: item.source || "", sourceId: item.sourceId || "", sourceUrl: item.sourceUrl || "" };
        el.detailTitle.textContent = item.title || "新作品";
        el.detailSubtitle.textContent = [item.category, item.creator, item.year].filter(Boolean).join(" · ") || "编辑评分与短评";
        el.titleField.value = item.title || "";
        el.originalTitleField.value = item.originalTitle || "";
        el.categoryField.value = item.category || "电影";
        el.statusField.value = item.status || "想看";
        el.creatorField.value = item.creator || "";
        el.yearField.value = item.year || "";
        document.querySelector("#languagesField").value = splitLabels(item.languages).join(", ");
        document.querySelector("#genresField").value = splitLabels(item.genres).join(", ");
        el.posterField.value = item.poster || "";
        el.ratingField.value = Number(item.rating || 0);
        el.ratingValue.textContent = Number(item.rating || 0).toFixed(1);
        const aspectScores = getAspectScores(item);
        renderAspectControls(item.category || "电影", aspectScores);
        setAspectControls(aspectScores);
        el.tagsField.value = (item.tags || []).join(", ");
        el.commentField.value = item.comment || "";
        el.detailPoster.replaceChildren(createPoster({ ...item, aspectScores }));
        renderRadar({ ...item, aspectScores });
        el.deleteButton.style.visibility = state.items.some(entry => entry.id === item.id) ? "visible" : "hidden";
        el.detail.classList.add("open");
        el.detail.setAttribute("aria-hidden", "false");
        setTimeout(() => el.titleField.focus(), 0);
      }

      function closeDetail() {
        document.querySelector(".radar-card").classList.remove("radar-expanded");
        document.querySelector("#expandRadar").textContent = "放大拖动八维图";
        state.editingId = null;
        state.editingSource = null;
        el.detail.classList.remove("open");
        el.detail.setAttribute("aria-hidden", "true");
      }

      function readFormItem() {
        return {
          id: state.editingId || crypto.randomUUID(),
          title: el.titleField.value.trim() || "未命名作品",
          originalTitle: el.originalTitleField.value.trim(),
          category: el.categoryField.value,
          emotionMode: state.editingEmotionMode === "awe" ? "awe" : "emotion",
          status: el.statusField.value,
          creator: el.creatorField.value.trim(),
          year: el.yearField.value.trim(),
          languages: splitLabels(document.querySelector("#languagesField").value),
          genres: splitLabels(document.querySelector("#genresField").value),
          rating: Number(el.ratingField.value || 0),
          aspectScores: {
            ...(state.items.find(item => item.id === state.editingId)?.aspectScores || {}),
            ...getCurrentAspectScores()
          },
          source: state.editingSource?.source || "",
          sourceId: state.editingSource?.sourceId || "",
          sourceUrl: state.editingSource?.sourceUrl || "",
          poster: el.posterField.value.trim(),
          tags: el.tagsField.value
            .split(/[,，]/)
            .map(tag => tag.trim())
            .filter(Boolean),
          comment: el.commentField.value.trim(),
          updatedAt: new Date().toISOString()
        };
      }

      function upsertItem(item) {
        const index = state.items.findIndex(entry => entry.id === item.id);
        if (index >= 0) state.items.splice(index, 1, item);
        else state.items.unshift(item);
        saveItems();
        render();
      }

      function deleteCurrentItem() {
        if (!state.editingId) return;
        state.items = state.items.filter(item => item.id !== state.editingId);
        saveItems();
        closeDetail();
        render();
        showToast("已删除");
      }

      function exportData() {
        const blob = new Blob([JSON.stringify({ version: 3, items: state.items, rankings }, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `media-cabinet-${new Date().toISOString().slice(0, 10)}.json`;
        link.click();
        URL.revokeObjectURL(url);
      }

      async function importData(file) {
        const text = await file.text();
        const parsed = JSON.parse(text);
        const incoming = Array.isArray(parsed) ? parsed : parsed?.items;
        if (!Array.isArray(incoming) || incoming.some(item => !item || typeof item !== "object")) throw new Error("备份格式无效");
        const incomingRankings = Array.isArray(parsed) ? [] : normalizeRankings(parsed.rankings);
        if (!confirm("导入会替换当前作品和榜单，建议先导出备份。继续？")) return;
        state.items = incoming.map(item => ({
          id: item.id || crypto.randomUUID(),
          title: String(item.title || "未命名作品"),
          originalTitle: String(item.originalTitle || ""),
          category: categories.some(category => category.id === item.category) ? item.category : "电影",
          status: String(item.status || "想看"),
          creator: String(item.creator || ""),
          year: item.year || "",
          rating: Number(item.rating || 0),
          languages: splitLabels(item.languages),
          genres: splitLabels(item.genres),
          poster: String(item.poster || ""),
          tags: Array.isArray(item.tags) ? item.tags.map(String) : [],
          aspectScores: getAspectScores(item),
          emotionMode: item.emotionMode === "awe" ? "awe" : "emotion",
          source: String(item.source || ""),
          sourceId: String(item.sourceId || ""),
          sourceUrl: String(item.sourceUrl || ""),
          comment: String(item.comment || ""),
          updatedAt: item.updatedAt || new Date().toISOString()
        }));
        rankings = incomingRankings;
        activeRanking = rankings[0]?.id || "";
        saveRankings();
        saveItems();
        render();
        showToast("作品、分类与榜单已导入");
      }

      function resetData() {
        if (!confirm("清空本机全部作品和榜单？此操作无法撤销，请先导出备份。")) return;
        state.items = [];
        rankings = [];
        activeRanking = "";
        saveRankings();
        saveItems();
        render();
        showToast("已清空本机数据");
      }

      function showToast(message) {
        el.toast.textContent = message;
        el.toast.classList.add("show");
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => el.toast.classList.remove("show"), 1800);
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      // Collection metadata is additive; the existing item storage key is unchanged.
      const RANKINGS_KEY = "yao-media-cabinet-rankings-v1";
      const collectionFilters = { year: "", language: "", genre: "" };
      let rankings = loadRankings();
      let activeRanking = rankings[0]?.id || "";
      const bulkSelection = new Set();

      function splitLabels(value) {
        const list = Array.isArray(value) ? value : String(value || "").split(/[,，;；]/);
        return [...new Set(list.map(value => String(value).trim()).filter(Boolean))];
      }

      function normalizeRankings(value) {
        if (!Array.isArray(value)) return [];
        const ids = new Set();
        return value.filter(entry => entry && typeof entry === "object").map(entry => {
          let id = String(entry.id || crypto.randomUUID());
          if (ids.has(id)) id = crypto.randomUUID();
          ids.add(id);
          const limit = [10, 50, 100].includes(Number(entry.limit)) ? Number(entry.limit) : 10;
          return { id, name: String(entry.name || "我的榜单").slice(0, 100), description: String(entry.description || "").slice(0, 300), limit,
            tournament: normalizeTournament(entry.tournament, limit),
            itemIds: [...new Set((Array.isArray(entry.itemIds) ? entry.itemIds : []).map(String))].slice(0, limit) };
        });
      }

      function loadRankings() {
        try { return normalizeRankings(JSON.parse(localStorage.getItem(RANKINGS_KEY) || "[]")); }
        catch { return []; }
      }

      function saveRankings() {
        const ids = new Set(state.items.map(item => item.id));
        rankings.forEach(list => { list.itemIds = list.itemIds.filter(id => ids.has(id)); });
        localStorage.setItem(RANKINGS_KEY, JSON.stringify(rankings));
      }

      function matchesCollectionFilters(item) {
        const year = /^\d{4}$/.test(String(item.year)) ? String(item.year) : "unknown";
        const selected = collectionFilters.year;
        if (selected && (selected.startsWith("decade:")
          ? year === "unknown" || Math.floor(Number(year) / 10) * 10 !== Number(selected.slice(7))
          : year !== selected)) return false;
        for (const [filter, field] of [["language", "languages"], ["genre", "genres"]]) {
          const wanted = collectionFilters[filter];
          if (!wanted) continue;
          if (filter === "genre" && item.category !== "专辑") return false;
          const values = splitLabels(item[field]);
          if (wanted === "unknown" ? values.length > 0 : !values.includes(wanted)) return false;
        }
        return true;
      }

        fillSelect(document.querySelector("#yearFilter"), [["", "全部年份"], ["unknown", "年份未知"],
          ...decades.map(year => [`decade:${year}`, `${year} 年代`]), ...years.map(year => [year, year])], collectionFilters.year);
        for (const [key, field, title] of [["language", "languages", "语言"], ["genre", "genres", "音乐类型"]]) {
          const values = [...new Set(state.items.filter(item => key !== "genre" || item.category === "专辑").flatMap(item => splitLabels(item[field])))].sort((a,b) => a.localeCompare(b,"zh-CN"));
          fillSelect(document.querySelector(`#${key}Filter`), [["", `全部${title}`], ["unknown", `${title}未知`], ...values.map(value => [value, value])], collectionFilters[key]);

      function moveRankingItem(list, id, target) {

        list.itemIds.splice(from, 1); list.itemIds.splice(target, 0, id);
